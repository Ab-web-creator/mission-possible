<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Possible</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Silkscreen&family=Chakra+Petch:wght@400;600&display=swap">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="game" aria-label="Mission Possible playfield"></canvas>
    <div id="overlay"><div class="card" id="card"></div></div>
    <div id="intro" class="intro" hidden><img id="introImg" alt=""><div class="introtx"><span class="sec" id="introKind">New demon</span><b id="introName"></b><span id="introDesc"></span><i id="introWis"></i><span class="introtip" id="introTip"></span><span class="introhint" id="introHint">Press any key or click to continue</span></div></div>
  </div>
  <aside class="side">
    <div class="brandrow"><div class="brand">Mission <span class="im">Im</span>possible</div><button class="pname" id="pName" type="button" title="Change your name"></button><span class="livesbadge" title="Lives"><span class="lbl">Lives</span><b id="hLives">3</b></span></div>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="halfL"><rect x="0" y="0" width="12" height="24"/></clipPath></defs></svg>
    <div class="hearts-row" id="hHearts" aria-label="Health"></div>
    <div class="stats">
      <div class="stat"><span class="lbl">Level</span><b id="hLevel">1</b></div>
      <div class="stat"><span class="lbl">Score</span><b id="hScore">0</b></div>
      <div class="stat"><span class="lbl">Best</span><b id="hBest">0</b></div>
    </div>
    <div class="extra" id="extraRow" title="Spell GRACE for an extra life"><span>G</span><span>R</span><span>A</span><span>C</span><span>E</span></div>
    <div class="kit">
      <span class="chip">Lamps <b id="kBombs">1</b></span>
      <span class="chip">Reach <b id="kFire">2</b></span>
      <span class="chip" id="kCap" hidden>Captives <b id="kCapN">0/0</b></span>
      <span class="chip">Speed <b id="kSpeed">1</b></span>
      <span class="chip">Fuse <b id="kFuse">2.4s</b></span>
    </div>
    <div class="ctrls">
      <button class="mini" id="btnMusic" type="button">Music on</button>
      <button class="mini" id="btnSound" type="button">Sound on</button>
      <button class="mini" id="btnPause" type="button">Pause</button>
      <button class="mini" id="btnFull" type="button">Full screen</button>
      <button class="mini save" id="btnSave" type="button">Save level</button>
      <button class="mini" id="btnSong" type="button">Load song</button>
      <button class="mini" id="btnGuide" type="button" style="grid-column:1/-1">Field guide</button>
      <input type="file" id="songFile" accept="audio/*" hidden>
      <audio id="embedSong" preload="auto"></audio>
    </div>
    <div class="saves">
      <div class="saveshead"><span class="sec">Saved levels <span id="slotCount"></span></span><button class="clearbtn" id="btnClearSaves" type="button" hidden>Delete all</button></div>
      <div class="slotlist" id="slotList"></div>
    </div>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
